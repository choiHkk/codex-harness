name: Bug report
description: Report an installation, validation, or Codex execution defect
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: codex-version
    attributes:
      label: Codex client and version
      description: App or CLI, version, and whether this is a new project session.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version.
    validations:
      required: true
  - type: dropdown
    id: failure-stage
    attributes:
      label: Failure stage
      options:
        - "Project installation"
        - "Static validation or automated tests"
        - "Skill or custom agent discovery"
        - "Live subagent execution"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include exact commands or prompts and relevant project agent settings. Redact private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: Include errors, observed agent sessions, and validation output as relevant.
    validations:
      required: true
