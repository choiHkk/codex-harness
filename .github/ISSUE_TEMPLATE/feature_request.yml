name: Feature request
description: Propose a capability for the Codex harness
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe a concrete project workflow that the current harness cannot handle well.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include affected roles, ownership boundaries, or architecture patterns when relevant.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Acceptance criteria
      description: What observable behavior would demonstrate that the feature works?
    validations:
      required: false
